name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }   # the oldest Node in package.json engines
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: examples/support-bot
      - run: bunx tsc --noEmit
      - run: bun test
      - run: bun run eval   # mock judge; proves the harness and dataset parse
      - run: bun run test:node   # build dist/ and import it from plain Node
      - run: bun start   # offline example: scripted model + mock judge
        working-directory: examples/support-bot
